<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق القرآن الكريم</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .font-quran { font-family: 'Amiri', serif; }
        .playing-ayah {
            border-color: #6366f1 !important;
            background-color: #f0fdf4 !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid font-bold text-2xl text-amber-400 fa-book-quran"></i>
                <h1 class="text-xl font-bold tracking-wide">القرآن الكريم</h1>
            </div>
            <div class="flex items-center gap-2">
                <select id="reciter-select" class="bg-indigo-800 text-white text-sm rounded-lg px-3 py-2 border border-indigo-700 focus:outline-none">
                    <option value="ar.alafasy">مشاري العفاسي</option>
                    <option value="ar.abdulbasitmurattal">عبد الباسط عبد الصمد (مرتل)</option>
                    <option value="ar.hudhaify">الحذيفي</option>
                    <option value="ar.husary">الحصري</option>
                    <option value="ar.saoodshuraym">سعود الشريم</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 flex-1 max-w-5xl">
        <div class="mb-6 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="relative w-full sm:w-80">
                <input type="text" id="search-input" placeholder="ابحث عن اسم السورة..." class="w-full pl-4 pr-10 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-sm"></i>
            </div>
            <div id="connection-status" class="text-xs px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> متصل بالشبكة
            </div>
        </div>

        <div id="surah-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p>جاري تحميل السور...</p>
            </div>
        </div>
    </main>

    <!-- Surah Details Modal -->
    <div id="surah-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-indigo-900 text-white p-4 flex justify-between items-center border-b border-indigo-800">
                <div>
                    <h2 id="modal-title" class="text-xl font-bold font-quran text-amber-400">اسم السورة</h2>
                    <p id="modal-subtitle" class="text-xs text-indigo-200 mt-1">تفاصيل السورة</p>
                </div>
                <button onclick="closeModal()" class="text-indigo-200 hover:text-white p-2 rounded-lg hover:bg-indigo-800">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Controls Header -->
            <div class="bg-slate-100 px-6 py-3 border-b flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center gap-2">
                    <!-- Play All Surah Button -->
                    <button id="play-full-surah-btn" onclick="playFullSurah()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-play"></i>
                        <span>تشغيل السورة كاملة</span>
                    </button>
                    <!-- Download Button -->
                    <button id="modal-download-btn" onclick="downloadCurrentClipAudio()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-download"></i>
                        <span>تحميل للاستماع بدون إنترنت</span>
                    </button>
                </div>
                <div class="text-xs text-slate-500 font-semibold" id="download-status-text">
                    يمكنك تشغيل السورة كاملة متتالية أو حفظها للاستماع بدون إنترنت.
                </div>
            </div>

            <div id="modal-body" class="p-6 overflow-y-auto space-y-6 flex-1 text-right"></div>

            <div class="bg-slate-50 p-4 border-t border-slate-200 flex items-center justify-between gap-4">
                <audio id="audio-player" controls class="w-full rounded-lg"></audio>
            </div>
        </div>
    </div>

    <script>
        const AUDIO_CACHE_NAME = 'quran-audio-cache-v4';
        let surahsData = [];
        let currentSurah = null;
        let currentAyahs = [];
        let currentAyahIndex = 0;
        let isContinuousPlayback = false;

        document.addEventListener('DOMContentLoaded', () => {
            fetchSurahs();
            setupNetworkListeners();
            registerServiceWorker();
            setupAudioPlayerEvents();
        });

        async function fetchSurahs() {
            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                surahsData = data.data;
                renderSurahs(surahsData);
            } catch (error) {
                console.error('Error fetching surahs:', error);
            }
        }

        function renderSurahs(surahs) {
            const container = document.getElementById('surah-grid');
            container.innerHTML = surahs.map(surah => `
                <div onclick="openSurah(${surah.number})" class="bg-white p-4 rounded-xl border border-slate-100 hover:border-indigo-300 shadow-sm hover:shadow-md cursor-pointer transition-all flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-700 font-bold flex items-center justify-center text-sm">
                            ${surah.number}
                        </div>
                        <div>
                            <h3 class="font-bold font-quran text-lg text-slate-800">${surah.name}</h3>
                            <p class="text-xs text-slate-500">${surah.englishNameTranslation} • ${surah.numberOfAyahs} آية</p>
                        </div>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${surah.revelationType === 'Meccan' ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'}">
                        ${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}
                    </span>
                </div>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = surahsData.filter(s => s.name.includes(term) || s.englishName.toLowerCase().includes(term));
            renderSurahs(filtered);
        });

        async function openSurah(surahNumber) {
            const reciter = document.getElementById('reciter-select').value;
            currentSurah = surahsData.find(s => s.number === surahNumber);
            currentAyahIndex = 0;
            isContinuousPlayback = false;
            
            document.getElementById('modal-title').innerText = currentSurah.name;
            document.getElementById('modal-subtitle').innerText = `${currentSurah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} • عدد آياتها: ${currentSurah.numberOfAyahs}`;
            document.getElementById('modal-body').innerHTML = '<div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-600"></i><p class="mt-2 text-sm text-slate-500">جاري تحميل الآيات...</p></div>';
            
            const downloadBtn = document.getElementById('modal-download-btn');
            downloadBtn.disabled = false;
            downloadBtn.className = 'bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-2 transition-all';
            downloadBtn.innerHTML = '<i class="fa-solid fa-download"></i><span>تحميل للاستماع بدون إنترنت</span>';
            document.getElementById('download-status-text').innerText = 'يمكنك تشغيل السورة كاملة متتالية أو حفظها للاستماع بدون إنترنت.';

            document.getElementById('surah-modal').classList.remove('hidden');

            try {
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${reciter}`);
                const data = await response.json();
                currentAyahs = data.data.ayahs;
                
                checkIfSurahIsCached(currentAyahs);
                renderAyahs(currentAyahs);
            } catch (error) {
                document.getElementById('modal-body').innerHTML = '<p class="text-center text-red-500 font-semibold py-8">حدث خطأ أثناء جلب آيات السورة، يرجى المحاولة لاحقاً.</p>';
            }
        }

        function renderAyahs(ayahs) {
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = ayahs.map((ayah, index) => `
                <div id="ayah-card-${index}" class="ayah-card p-4 bg-slate-50/50 rounded-xl border border-slate-100 flex flex-col gap-3 transition-all">
                    <p class="font-quran text-2xl leading-relaxed text-slate-800">${ayah.text}</p>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-200/60">
                        <span class="text-xs text-slate-500 bg-white px-2.5 py-1 rounded-full border border-slate-200 font-bold">الآية ${ayah.numberInSurah}</span>
                        <button onclick="playSingleAyah(${index})" class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5">
                            <i class="fa-solid fa-play"></i> تشغيل
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function playSingleAyah(index) {
            isContinuousPlayback = false;
            currentAyahIndex = index;
            playAyahByIndex(index);
        }

        function playFullSurah() {
            if (!currentAyahs.length) return;
            isContinuousPlayback = true;
            currentAyahIndex = 0;
            playAyahByIndex(0);
        }

        async function playAyahByIndex(index) {
            if (index < 0 || index >= currentAyahs.length) return;

            const ayah = currentAyahs[index];
            const player = document.getElementById('audio-player');
            
            highlightCurrentAyah(index);

            try {
                const cache = await caches.open(AUDIO_CACHE_NAME);
                const cachedResponse = await cache.match(ayah.audio);

                if (cachedResponse) {
                    const blob = await cachedResponse.blob();
                    player.src = URL.createObjectURL(blob);
                } else {
                    player.src = ayah.audio;
                }

                player.load();
                await player.play();
            } catch (err) {
                player.src = ayah.audio;
                player.load();
                player.play();
            }
        }

        function setupAudioPlayerEvents() {
            const player = document.getElementById('audio-player');
            player.addEventListener('ended', () => {
                if (isContinuousPlayback && currentAyahIndex < currentAyahs.length - 1) {
                    currentAyahIndex++;
                    playAyahByIndex(currentAyahIndex);
                }
            });
        }

        function highlightCurrentAyah(index) {
            document.querySelectorAll('.ayah-card').forEach(el => el.classList.remove('playing-ayah'));
            const currentCard = document.getElementById(`ayah-card-${index}`);
            if (currentCard) {
                currentCard.classList.add('playing-ayah');
                currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function closeModal() {
            document.getElementById('surah-modal').classList.add('hidden');
            const player = document.getElementById('audio-player');
            player.pause();
            player.src = '';
            isContinuousPlayback = false;
        }

        // دالة التحميل المعدلة المعالجة لأخطاء CORS والمخزن
        async function downloadCurrentClipAudio() {
            if (!currentAyahs.length) return;
            
            const downloadBtn = document.getElementById('modal-download-btn');
            const statusText = document.getElementById('download-status-text');

            try {
                downloadBtn.disabled = true;
                downloadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>جاري التحميل...</span>';

                const cache = await caches.open(AUDIO_CACHE_NAME);
                let count = 0;

                for (const ayah of currentAyahs) {
                    try {
                        const response = await fetch(ayah.audio, { mode: 'cors' });
                        if (!response.ok) throw new Error('Network response was not ok');
                        await cache.put(ayah.audio, response);
                    } catch (e) {
                        // Fallback handling
                        const response = await fetch(ayah.audio, { mode: 'no-cors' });
                        await cache.put(ayah.audio, response);
                    }
                    count++;
                    statusText.innerText = `تم تخزين ${count} من ${currentAyahs.length} آية...`;
                }

                downloadBtn.className = 'bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-2 cursor-default';
                downloadBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>محفوظة بدون إنترنت</span>';
                statusText.innerText = 'تم حفظ جميع الآيات بنجاح للأوفلاين!';
            } catch (error) {
                console.error('Download Error:', error);
                downloadBtn.disabled = false;
                downloadBtn.className = 'bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-2 transition-all';
                downloadBtn.innerHTML = '<i class="fa-solid fa-download"></i><span>إعادة المحاولة</span>';
                statusText.innerText = 'تعذر التحميل، يرجى التأكد من تشغيل السيرفر المحلي (Live Server/HTTP) وليس فتح الملف مباشرة من المجلد.';
            }
        }

        async function checkIfSurahIsCached(ayahs) {
            if (!('caches' in window) || !ayahs.length) return;
            try {
                const cache = await caches.open(AUDIO_CACHE_NAME);
                const match = await cache.match(ayahs[0].audio);
                if (match) {
                    const downloadBtn = document.getElementById('modal-download-btn');
                    downloadBtn.disabled = true;
                    downloadBtn.className = 'bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-2 cursor-default';
                    downloadBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>محفوظة بدون إنترنت</span>';
                    document.getElementById('download-status-text').innerText = 'السورة متوفرة للاستماع أوفلاين.';
                }
            } catch(e) {
                console.error(e);
            }
        }

        function setupNetworkListeners() {
            const statusBadge = document.getElementById('connection-status');
            function updateOnlineStatus() {
                if (navigator.onLine) {
                    statusBadge.className = 'text-xs px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold flex items-center gap-1.5';
                    statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> متصل بالشبكة';
                } else {
                    statusBadge.className = 'text-xs px-3 py-1.5 rounded-full bg-amber-100 text-amber-800 font-semibold flex items-center gap-1.5';
                    statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> غير متصل (يعمل بدون نت)';
                }
            }
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();
        }

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            }
        }
    </script>
</body>
</html>
